<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriARge — Einsatzleitung</title>
  <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">▲</span>
      <h1>TriARge <span class="sub">Einsatzleitung</span></h1>
    </div>
    <div class="header-status">
      <div class="counts" id="counts"></div>
      <select id="session-select" class="session-select" title="Einsatz wechseln"></select>
      <button id="new-session-btn" class="radio-btn" title="Neuen Einsatz starten (bisherige Daten bleiben erhalten)">
        ＋ Neuer Einsatz
      </button>
      <button id="radio-toggle" class="radio-btn" title="Sprechfunk-Analyse (Mikrofon/AUX)">
        ● Funk aus
      </button>
      <span class="pill" id="sync-pill">lokal</span>
      <span class="pill" id="ws-pill">verbinde…</span>
    </div>
  </header>

  <main>
    <section id="board" class="board" aria-label="Patientenübersicht"></section>

    <aside class="sidebar">
      <div class="team-section">
        <h2>Einsatztrupps
          <button id="add-team-btn" class="mini-btn" title="Trupp hinzufügen">＋</button>
        </h2>
        <div id="team-list" class="team-list">
          <p class="muted">Keine Trupps registriert.</p>
        </div>
      </div>
      <h2>Sprechfunk</h2>
      <div id="radio-log" class="radio-log">
        <p class="muted">Noch keine Transmissionen.</p>
      </div>
    </aside>
  </main>

  <script src="/static/app.js?v=2"></script>
</body>
</html>
