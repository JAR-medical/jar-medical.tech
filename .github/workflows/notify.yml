# Copy to .github/workflows/notify.yml in each repo.
# Replace ubuntu-latest and website. Change NOTHING else, so all five repos behave alike.
#
#   ubuntu-latest          private repos: [self-hosted, Linux, X64]      jar-medical.tech: ubuntu-latest
#   website  main everywhere except jar-medical.tech, which is `website`
#
# The `push` trigger is pinned to the default branch on purpose. The notifier would ignore a
# feature-branch push anyway, but there is only ONE self-hosted runner in the org, so letting
# every branch push occupy it just to decide "not notable" would queue behind real test runs.

name: Notify

on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  pull_request_review:
    types: [submitted]
  push:
    branches: [website]
  workflow_run:
    workflows: [CI]
    types: [completed]
  issues:
    types: [opened, closed, reopened]
  issue_comment:
    types: [created]
  release:
    types: [published]
  create:
  delete:
  fork:
  watch:
    types: [started]

# Read-only: this job reports, it never writes to the repo.
permissions:
  contents: read

# Never cancel a notification in flight — a dropped failure alert is the one
# thing this must not do.
concurrency:
  group: notify-${{ github.event_name }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  whatsapp:
    name: WhatsApp
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send notable event to the team group
        uses: JAR-medical/jar-ci@main
        with:
          phone_number_id: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          access_token: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          to: ${{ secrets.WHATSAPP_TO }}
          # Unconfigured is fine: the action warns and exits 0 rather than
          # failing the job, so this can never turn a green build red.
          required: 'false'
