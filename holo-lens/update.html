<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>J.A.R. AR-Client — aktualisieren</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #101418; color: #e8edf2;
      font: 18px/1.5 "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 32px 20px; }
    h1 { font-size: 28px; margin: 0 0 8px; }
    p { color: #93a1ad; margin: 0 0 20px; }
    pre { white-space: pre-wrap; word-break: break-word; min-height: 8em; padding: 14px; border-radius: 12px;
      background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12); font: 16px/1.5 ui-monospace, Menlo, Consolas, monospace; }
    a.go { display: inline-block; margin-top: 20px; padding: 16px 28px; border-radius: 14px; background: #3e7bfa; color: #fff;
      font-weight: 600; font-size: 22px; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>App aktualisieren</h1>
    <p>Holt alle Dateien der App neu vom Server und räumt den Zwischenspeicher dieses Geräts auf. Dauert wenige Sekunden.</p>
    <pre id="out" role="status" aria-live="polite"></pre>
    <a id="go" class="go" href="./" hidden>Zur App</a>
  </main>
  <script src="update.js"></script>
</body>
</html>
