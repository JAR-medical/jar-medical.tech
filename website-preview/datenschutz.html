<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    padding: 1.5rem;
    background: #19183b; color: #fff;
    font: 400 16px/1.6 "Inter Tight", "Inter", -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .box { width: 100%; max-width: 22rem; text-align: center; }
  .mark {
    width: 54px; height: 54px; margin: 0 auto 1.75rem;
    /* flex, not grid: place-items would put the <span> in a row of its own and
       stack the + under the J. */
    display: flex; align-items: center; justify-content: center;
    border-radius: 15px; background: #23224f;
    box-shadow: inset 0 0 0 1px rgba(142,199,184,.34);
    font-weight: 700; font-size: 1.05rem; letter-spacing: -.02em;
  }
  .mark span { color: #8ec7b8; }
  h1 { margin: 0 0 .5rem; font-size: 1.2rem; font-weight: 700; letter-spacing: -.02em; }
  p { margin: 0 0 1.75rem; font-size: .9375rem; color: #b9c0d4; }
  form { display: grid; gap: .625rem; }
  input {
    width: 100%; padding: .8rem 1rem;
    border: 0; border-radius: 999px;
    background: #23224f; color: #fff;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.14);
    font: inherit; font-size: .9375rem; text-align: center;
  }
  input:focus { outline: 2px solid #8ec7b8; outline-offset: 2px; }
  button {
    padding: .8rem 1rem; border: 0; border-radius: 999px;
    background: #8ec7b8; color: #19183b;
    font: inherit; font-size: .9375rem; font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #a3d5c8; }
  button[disabled] { opacity: .55; cursor: progress; }
  .err { min-height: 1.25rem; margin: .75rem 0 0; font-size: .875rem; color: #f0776e; }
</style>
</head>
