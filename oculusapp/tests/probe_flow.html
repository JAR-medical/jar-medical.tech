<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>probe</title>
  <link rel="stylesheet" href="../css/hud.css">
</head>
<body>
  <div id="shots"></div>
  <script type="module">
    import { Workflow } from "../js/workflow.js";
    import { drawHudLayer, drawCard, drawTag } from "../js/hudscreen.js";

    /* Zusammenschau der drei AR-Ebenen auf einer Fläche: kopffestes HUD,
     * raumfeste Handlungskarte, raumfeste Schilder. Die Größenverhältnisse
     * entsprechen den Rechtecken in xr.js (HUD 2,20 m, Karte 0,86 m, Schild
     * 0,44 m breit), damit beurteilbar ist, wie viel Blickfeld was einnimmt.
     * Der Hintergrund tut so, als wäre er Durchblick. */
    const W = 1536, H = 864;
    const CARD_SCALE = 1.12 / 1.64;      // Karte 1,12 m gegen HUD-Breite 1,64 m
    const TAG_SCALE = 0.60 / 1.64;

    const from = Number(new URLSearchParams(location.search).get("from") || 1);
    let shotNo = 0;

    const flow = new Workflow();
    let current = null;
    flow.onScreen = (s) => { current = s; };
    flow.onSpeak = () => {};
    flow.onToast = () => {};

    const off = (w, h) => {
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      return c;
    };

    function passthrough(ctx) {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#6d7580"); g.addColorStop(0.52, "#8a8f96"); g.addColorStop(1, "#4a4f56");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "rgba(255,255,255,0.06)";
      for (let i = 0; i < 9; i++) ctx.fillRect(i * 190 + 40, 300 + (i % 3) * 60, 120, 260);
    }

    function shot(label) {
      if (++shotNo < from) return;

      const wrap = document.createElement("figure");
      wrap.style.cssText = "margin:0 0 18px;padding:0";
      const cap = document.createElement("figcaption");
      cap.textContent = label;
      cap.style.cssText = "font:600 15px/1.6 Helvetica,Arial;color:#9fb0c0;padding:4px 2px";

      const c = off(W, H);
      c.style.cssText = "width:100%;height:auto;display:block";
      const ctx = c.getContext("2d");
      passthrough(ctx);

      const hud = off(W, H);
      drawHudLayer(hud.getContext("2d"), W, H, current, flow.mapModel());
      ctx.drawImage(hud, 0, 0);

      // Schilder dort, wo Patienten im Raum stünden (zwei zur Anschauung).
      const tags = flow.worldTags().filter((t) => !t.target);
      const tagW = W * TAG_SCALE, tagH = tagW * (176 / 512);
      [[W * 0.26, H * 0.44], [W * 0.76, H * 0.40]].forEach(([tx, ty], i) => {
        const t = tags[i];
        if (!t) return;
        const tc = off(512, 176);
        drawTag(tc.getContext("2d"), 512, 176, t);
        ctx.drawImage(tc, tx - tagW / 2, ty - tagH / 2, tagW, tagH);
      });

      const cw = W * CARD_SCALE, ch = cw * (640 / 900);
      const card = off(900, 640);
      drawCard(card.getContext("2d"), 900, 640, current, { hover: 0, dwell: 0.45 });
      ctx.drawImage(card, W / 2 - cw / 2, H * 0.53 - ch / 2, cw, ch);

      wrap.appendChild(cap); wrap.appendChild(c);
      document.getElementById("shots").appendChild(wrap);
    }

    const press = (re) => {
      const b = current.buttons.find((x) => re.test(x.label));
      if (!b) throw new Error("Knopf nicht gefunden: " + re + " — vorhanden: " +
        current.buttons.map((x) => x.label).join(", "));
      b.action();
    };

    try {
      flow.setPose({ x: 0, y: 1.7, z: 0 }, { x: 0, y: 0, z: -1 });
      flow.start();
      shot("1 · leere Lage");

      flow.setPose({ x: 1.5, y: 1.7, z: -3 }, { x: 0, y: 0, z: -1 });
      press(/Neuer Patient/);
      shot("2 · mSTaRT Frage 1");

      press(/^NEIN$/); press(/^NEIN$/);
      shot("3 · Frage 3 mit Verlauf");

      press(/^JA$/); press(/^NEIN$/); press(/^JA$/); press(/^JA$/);
      shot("4 · Ergebnis");

      press(/Karte zuweisen/);
      shot("5 · Karte zuweisen");

      press(/übernehmen/);
      shot("6 · erfasst");

      press(/Weiter/);
      flow.setPose({ x: 9, y: 1.7, z: -6 }, { x: 0.4, y: 0, z: -1 });
      flow.tick();
      shot("7 · Lage mit einem Patienten");

      document.title = "OK " + document.querySelectorAll("canvas").length;
    } catch (e) {
      document.title = "ERR:" + e.message;
      document.body.insertAdjacentHTML("afterbegin",
        '<pre style="color:#ff6b6b;font:13px monospace;white-space:pre-wrap">' + e.stack + "</pre>");
    }
  </script>
</body>
</html>
