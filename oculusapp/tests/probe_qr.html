<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>probe-qr</title>
  <script src="../vendor/jsQR.min.js"></script>
</head>
<body style="font:13px/1.6 Menlo,monospace;background:#111;color:#ddd;padding:16px">
  <pre id="log"></pre>
  <script type="module">
    /* Prüft, ob die gedruckten Karten wirklich lesbar sind — mit genau dem
     * Decoder, den auch der Kamera-Modus benutzt (vendor/jsQR.min.js).
     *
     * Jeder QR aus dem Druckbogen wird auf eine Canvas gerastert und decodiert;
     * zusätzlich in der Größe, die eine Handykamera aus ~50 cm von einer 42 mm
     * großen Karte etwa liefert (rund 160 px), und einmal mit Rauschen und
     * leichter Drehung, damit „sauber im Labor" nicht als Beweis durchgeht.
     */
    import { parseMarkerPayload } from "../js/qr.js";

    const log = (s) => (document.getElementById("log").textContent += s + "\n");

    const svgToImage = (svg) => new Promise((res, rej) => {
      const blob = new Blob([svg], { type: "image/svg+xml" });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); res(img); };
      img.onerror = (e) => { URL.revokeObjectURL(url); rej(e); };
      img.src = url;
    });

    function decodeAt(img, px, { rotate = 0, noise = 0 } = {}) {
      const c = document.createElement("canvas");
      c.width = c.height = px;
      const ctx = c.getContext("2d", { willReadFrequently: true });
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, px, px);
      ctx.translate(px / 2, px / 2);
      ctx.rotate((rotate * Math.PI) / 180);
      ctx.drawImage(img, -px / 2, -px / 2, px, px);
      ctx.setTransform(1, 0, 0, 1, 0, 0);

      const data = ctx.getImageData(0, 0, px, px);
      if (noise) {
        const d = data.data;
        for (let i = 0; i < d.length; i += 4) {
          const n = (Math.random() - 0.5) * noise;
          d[i] += n; d[i + 1] += n; d[i + 2] += n;
        }
        ctx.putImageData(data, 0, 0);
      }
      const res = jsQR(data.data, px, px);
      return res ? res.data : null;
    }

    try {
      const html = await (await fetch("../assets/markers/patientenkarten.html")).text();
      const doc = new DOMParser().parseFromString(html, "text/html");
      const cards = [...doc.querySelectorAll(".card")];
      log(`Karten im Bogen: ${cards.length}`);

      let ok = 0, bad = 0;
      for (const card of cards) {
        const expect = card.querySelector(".code").textContent.trim();
        const pid = Number(card.querySelector(".nr strong").textContent.replace("#", ""));
        const svg = card.querySelector("svg").outerHTML;
        const img = await svgToImage(svg);

        const trials = [
          ["klar 480px", decodeAt(img, 480)],
          ["Kamera ~160px", decodeAt(img, 160)],
          ["schräg 12° + Rauschen", decodeAt(img, 260, { rotate: 12, noise: 70 })],
        ];

        const fails = trials.filter(([, got]) => got !== expect);
        const parsed = parseMarkerPayload(expect);
        const parseOk = parsed === pid;

        if (fails.length === 0 && parseOk) {
          ok++;
          log(`  ok   ${expect.padEnd(9)} → Patient ${pid}`);
        } else {
          bad++;
          log(`  FAIL ${expect}: ` +
              fails.map(([n, got]) => `${n}=${got ?? "nichts"}`).join(", ") +
              (parseOk ? "" : ` · qr.js liest "${expect}" als ${parsed}`));
        }
      }

      log(`\n${ok} Karten lesbar, ${bad} nicht.`);
      document.title = bad === 0 ? `OK ${ok}` : `FAIL ${bad}`;
    } catch (e) {
      document.title = "ERR:" + e.message;
      log("FEHLER: " + e.stack);
    }
  </script>
</body>
</html>
